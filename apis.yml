aid: pocus
name: Pocus
description: >-
  Pocus is an AI sales intelligence and product-led sales platform that turns product usage,
  CRM and third-party buying signals into prioritized action for revenue teams. It ingests data
  from customer data warehouses (Snowflake, Redshift, Postgres, Athena, Databricks) and CRMs
  (Salesforce, HubSpot), scores and enriches accounts and contacts, and surfaces recommendations
  to reps through an Intelligent Inbox, Playbooks, Lists, SmartMap and a Chrome extension, with
  write-back and sequencing into Salesforce, HubSpot, Outreach, Salesloft, Apollo, Gong and Slack.
  Its programmable surface is a GraphQL core API at api.pocus.com, an OAuth 2.0 / OpenID Connect
  authorization server at auth.pocus.com, SCIM 2.0 user provisioning and SAML SSO, plus a Snowflake
  data share for warehouse-native delivery. Pocus was acquired by Apollo.io, announced 2026-03-19.
