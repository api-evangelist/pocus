apis:
- aid: pocus-core-api
  name: Pocus Core API
  description: >-
    The Pocus core API is a GraphQL endpoint at https://api.pocus.com/graphql, confirmed live and
    authoritatively named as POCUS_CORE_API_ENDPOINT in Pocus' own published @pocus/cli package.
    Introspection is disabled in production, so no machine-readable schema is retrievable
    anonymously and Pocus publishes no OpenAPI or SDL. Requests carry a bearer JWT.
  humanURL: https://docs.pocus.com/docs/what-is-pocus
  baseURL: https://api.pocus.com
  tags:
  - GraphQL
  - Sales Intelligence
  properties:
