- aid: pocus-identity
  name: Pocus Identity (OAuth 2.0 / OpenID Connect)
  description: >-
    Pocus operates an OAuth 2.0 authorization server and OpenID Connect provider at
    auth.pocus.com, publishing RFC 8414 authorization-server metadata, OIDC discovery and a JWKS
    document anonymously. It supports authorization_code with PKCE (S256), refresh_token,
    client_credentials, RFC 8693 token exchange and RFC 8628 device authorization grants, and
    fronts SAML 2.0 SSO for enterprise identity providers such as Okta.
  humanURL: https://docs.pocus.com/docs/okta
  baseURL: https://auth.pocus.com
  tags:
  - OAuth
  - OpenID Connect
  - Identity
  properties:
  - type: OAuthScopes
    url: scopes/pocus-scopes.yml
  - type: OpenIDConnect
    url: well-known/pocus-auth-openid-configuration.json
