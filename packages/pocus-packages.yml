name: Pocus packages and client libraries
description: >-
  Pocus publishes exactly one first-party package to a language registry — an oclif CLI on npm —
  plus a first-party Chrome extension distributed through the Chrome Web Store. There is no
  official REST/GraphQL client SDK in any language. The npm package has not been republished since
  2021 and its hardcoded production identity pool no longer exists, so it is recorded as abandoned.

packages:
- name: '@pocus/cli'
  registry: npm
  url: https://www.npmjs.com/package/@pocus/cli
  official: true
  official_evidence: >-
    package.json homepage is https://pocus.com, author is "Pocus Team", and the sole npm maintainer
    is "pocus_isaac" (Isaac Pellerin, Pocus co-founder/CTO). Scope @pocus contains no other package.
  language: TypeScript
  kind: cli
  version: 0.1.1
  published: '2021-08-23'
  first_published: '2021-08-21'
  versions_published: 3
  license: null
  repository: null
  install: npm install -g @pocus/cli
  status: abandoned
  status_evidence: >-
    Latest release 0.1.1 is dated 2021-08-23 — roughly five years before this probe, and four years
    before the AI platform the company now sells. The package hardcodes its production AWS Cognito
    user pool (us-east-1) in lib/util/config.js; that pool now returns
    {"message":"User pool ... does not exist."} (HTTP 404), so the published CLI can no longer
    authenticate against Pocus at all.
  note: >-
    Bundles @apollo/client and points at ${POCUS_CORE_API_ENDPOINT}/graphql — this package is the
    authoritative first-party evidence that the Pocus core API is GraphQL at https://api.pocus.com.

